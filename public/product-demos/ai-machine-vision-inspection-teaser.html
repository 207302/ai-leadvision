<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine Vision Inspection — 30s teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#f4f6f8; --panel:#ffffff; --card:#ffffff; --rule:#b7c3d4;
  --ink:#121826; --dim:#4e5b70; --body:#3a4658;
  --amber:#1a5fd4; --ok:#157347; --caller:#0e7490; --signal:#c2410c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f4f6f8;overflow:hidden}
body{font-family:Archivo,system-ui,sans-serif}
#fit{width:100vw;height:100vh;position:relative;overflow:hidden}
#stage{width:1920px;height:1080px;overflow:hidden;background:var(--sky);color:var(--ink);
       position:absolute;left:50%;top:50%}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:
    radial-gradient(ellipse 48% 40% at 88% 0%,rgba(26,95,212,.12),transparent 68%),
    radial-gradient(120% 90% at 50% 40%,transparent 62%,rgba(18,24,38,.055) 100%),
    repeating-linear-gradient(0deg,rgba(18,24,38,.03) 0 1px,transparent 1px 3px)}
.mono{font-family:"DM Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.disp{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 78,"wght" 800;
      text-transform:uppercase;letter-spacing:-.005em;line-height:.94}
#head{position:absolute;top:0;left:0;right:0;height:96px;z-index:30;display:flex;align-items:center;
  gap:28px;padding:0 64px;border-bottom:1px solid var(--rule);background:var(--panel);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;opacity:0}
#dot{width:13px;height:13px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 12px var(--ok)}
#dotLabel{font-size:14px;color:var(--dim)}
#headName{margin-left:auto;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
#tc{font-size:15px;color:var(--dim);min-width:132px;text-align:right;font-variant-numeric:tabular-nums}
.scene{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none}
#caption{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:36;opacity:0;
  white-space:nowrap;font-size:32px;color:var(--ink);font-variation-settings:"wdth" 90,"wght" 600;
  background:var(--panel);border:1px solid var(--rule);border-radius:40px;padding:18px 44px;
  box-shadow:0 6px 22px rgba(18,24,38,.16)}
#s4{display:grid;place-items:center;padding:0 64px}
#chans{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:1792px}
.ch{background:var(--panel);padding:52px 44px 44px;opacity:0;transform:translateY(26px);
    box-shadow:0 2px 12px rgba(18,24,38,.10)}
.ch .n{font-size:13px;color:var(--dim)}
.ch .t{margin-top:22px;font-size:60px;font-variation-settings:"wdth" 74,"wght" 900;
       text-transform:uppercase;line-height:.94}
.ch .d{margin-top:20px;font-size:24px;color:var(--body);line-height:1.42;
       font-variation-settings:"wdth" 100,"wght" 400}
.ch .bars{display:flex;gap:5px;margin-top:38px;height:34px;align-items:flex-end}
.ch .bars i{flex:1;background:var(--rule);display:block}
#s5{display:grid;place-items:center;padding:0 96px}
#s5in{width:100%;max-width:1728px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);
       border-bottom:1px solid var(--rule)}
.stat{padding:44px 0;opacity:0}
.stat .v{font-size:96px;font-variation-settings:"wdth" 68,"wght" 900;color:var(--ink);
         font-family:"DM Mono",monospace;letter-spacing:-.03em;line-height:1}
.stat .v em{font-style:normal;font-size:38px;color:var(--dim);margin-left:8px}
.stat .k{margin-top:18px;font-size:14px;color:var(--dim)}
#lock{margin-top:76px;display:flex;align-items:flex-end;justify-content:space-between;opacity:0}
#brand{font-size:104px;font-variation-settings:"wdth" 66,"wght" 900;line-height:.9}
#tag{margin-top:26px;font-size:29px;color:var(--body);font-variation-settings:"wdth" 100,"wght" 400}
#cta{text-align:right;font-size:15px;color:var(--dim);line-height:2.1}
#cta b{display:block;font-family:Archivo;font-size:31px;color:var(--amber);letter-spacing:0;
       text-transform:none;font-variation-settings:"wdth" 100,"wght" 600;margin-top:10px}
#cover{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--sky);
       transition:opacity .45s}
#cover.gone{opacity:0;pointer-events:none}
#coverBtn{display:grid;place-items:center;gap:26px;background:none;border:none;cursor:pointer;
          color:var(--ink);font-family:Archivo,sans-serif}
#coverBtn:focus-visible{outline:2px solid var(--amber);outline-offset:8px}
#coverRing{width:112px;height:112px;border-radius:50%;border:2px solid var(--amber);background:rgba(26,95,212,.08);
           display:grid;place-items:center}
#coverRing svg{width:34px;height:34px;fill:var(--amber);margin-left:5px}
#coverTxt{font-size:16px;letter-spacing:.14em}
#coverSub{font-size:12px;color:var(--dim);letter-spacing:.12em}
/* transport — stays on screen; 44px targets so pause works on touch */
#ctl{
  position:fixed;left:8px;bottom:8px;z-index:100;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  max-width:calc(100% - 16px);opacity:1;pointer-events:auto;
  padding:6px;border-radius:12px;
  background:rgba(244,246,248,.94);border:1px solid #e3e7ee;
  box-shadow:0 10px 28px rgba(18,24,38,.16);
}
#ctl button{
  font-family:"DM Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;background:#fff;color:#121826;border:1px solid #b7c3d4;
  min-height:44px;min-width:44px;padding:0 14px;border-radius:8px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){
  #ctl button:hover{color:#1a5fd4;border-color:#1a5fd4}
}
#ctl button:focus-visible{outline:2px solid #1a5fd4;outline-offset:2px}
#ctl button[aria-pressed="true"]{background:#1a5fd4;color:#fff;border-color:#144eaf}
#ctl button:disabled{opacity:.42;cursor:default}
@media (hover:hover) and (pointer:fine){
  #ctl button:disabled:hover{color:#121826;border-color:#b7c3d4}
}
#ctl span{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;color:#4e5b70;letter-spacing:.04em}
@media (max-width:720px),(pointer:coarse){#ctl span{display:none}}

#s1{display:grid;place-items:center}
#s1big{font-size:17px;color:var(--dim)}
#mid{position:absolute;left:64px;top:150px;width:1792px;z-index:22;opacity:0}
#belt{width:1792px;height:700px;display:block}
#counters{position:absolute;left:6px;top:8px;font-size:15px;color:var(--dim)}
#counters b{color:var(--ink);font-weight:500}
#counters .bad{color:var(--signal)}

</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="head">
    <span id="dot"></span><span id="dotLabel" class="mono"></span>
    <span id="headName" class="mono"></span><span id="tc" class="mono">00:00.000</span>
  </div>

  <section class="scene" id="s1"><div style="text-align:center">
    <div id="s1big" class="mono">camera 01 — calibrating</div>
  </div></section>
  <div id="mid">
    <div id="counters" class="mono">inspected <b id="cIn">0</b> &nbsp;·&nbsp;
      defects <b id="cDef" class="bad">0</b> &nbsp;·&nbsp; 1,240 / min</div>
    <svg id="belt" viewBox="0 0 1792 700">
      <line x1="20" y1="600" x2="1772" y2="600" stroke="var(--rule)" stroke-width="4"/>
      <g id="zone" stroke="var(--ink)" stroke-width="5" fill="none">
        <path d="M766 400 h-38 M766 400 v38 M1026 400 h38 M1026 400 v38
                 M766 610 h-38 M766 610 v-38 M1026 610 h38 M1026 610 v-38"/>
      </g>
      <g id="pgroup"></g>
      <rect id="hibox" x="0" y="440" width="170" height="150" rx="8"
            fill="none" stroke="var(--ok)" stroke-width="5" opacity="0"/>
      <g id="ptag" opacity="0">
        <rect id="ptagBg" x="-150" y="-72" width="300" height="52" rx="26"
              fill="var(--panel)" stroke="var(--rule)" stroke-width="2"/>
        <text id="ptagTx" x="0" y="-38" text-anchor="middle" font-family="DM Mono, monospace"
              font-size="21" letter-spacing="2" fill="var(--ok)"></text>
      </g>
    </svg>
  </div>

  <div id="caption"></div>
  <section class="scene" id="s4"><div id="chans"></div></section>
  <section class="scene" id="s5"><div id="s5in">
    <div id="stats"></div>
    <div id="lock">
      <div><h1 id="brand" class="disp"></h1><p id="tag"></p></div>
      <div id="cta" class="mono"><span></span><b></b></div>
    </div>
  </div></section>
  <div id="cover">
    <button id="coverBtn" type="button" aria-label="Play teaser with sound">
      <span id="coverRing"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg></span>
      <span id="coverTxt" class="mono">play with sound</span>
      <span id="coverSub" class="mono">30 seconds &middot; sound on</span>
    </button>
  </div>
</div></div>
<div id="ctl">
  <button id="pause" type="button" aria-pressed="false" aria-label="Pause demo" disabled>Pause</button>
  <button id="replay" type="button">Replay</button>
  <button id="mute" type="button" aria-pressed="false" aria-label="Mute demo">Mute</button>
  <span id="hint">Space pause · R replay · M mute</span>
</div>
<script>
const CONFIG = {
  brand:"Machine Vision Inspection", tagline:"Every part. Every flaw.",
  ctaLine:"See it on your line", ctaUrl:"yoursite.com/vision",
  caption:"It sees the 0.3 mm you can't.",
  headLeft:"camera 01 — calibrated", headRight:"inspected — 0000",
  barHi:"var(--signal)",
  channels:[
    { n:"check 01", t:"Surface",    d:"Scratches, chips and stains at line speed." },
    { n:"check 02", t:"Dimensions", d:"Sub-millimetre gauging on every unit." },
    { n:"check 03", t:"Assembly",   d:"Missing parts caught before the box closes." }
  ],
  stats:[
    { v:"0.3",   u:"mm", k:"smallest defect caught" },
    { v:"99.9",  u:"%",  k:"catch rate" },
    { v:"1,240", u:"",   k:"parts per minute" }
  ]
};
const DUR = 30000;
const $ = s => document.querySelector(s);
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  const ctl = $('#ctl');
  if (!ctl) return;
  const stageW = 1920 * s, stageH = 1080 * s;
  ctl.style.left = Math.max(8, (innerWidth - stageW) / 2 + 8) + 'px';
  ctl.style.bottom = Math.max(8, (innerHeight - stageH) / 2 + 8) + 'px';
}
addEventListener('resize', fit); fit();

$('#brand').textContent = CONFIG.brand;
$('#tag').textContent = CONFIG.tagline;
$('#cta span').textContent = CONFIG.ctaLine;
$('#cta b').textContent = CONFIG.ctaUrl;
$('#caption').textContent = CONFIG.caption;
$('#dotLabel').textContent = CONFIG.headLeft;
$('#headName').textContent = CONFIG.headRight;
$('#chans').innerHTML = CONFIG.channels.map(c => `
  <div class="ch"><div class="n mono">${c.n}</div><div class="t">${c.t}</div>
  <div class="d">${c.d}</div><div class="bars">${'<i></i>'.repeat(22)}</div></div>`).join('');
$('#stats').innerHTML = CONFIG.stats.map(s => `
  <div class="stat"><div class="v">${s.v}${s.u?`<em>${s.u}</em>`:''}</div>
  <div class="k mono">${s.k}</div></div>`).join('');

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const lerp=(a,b,p)=>a+(b-a)*p;
const set=(el,o,y=0)=>{el.style.opacity=o;if(y!==null)el.style.transform=`translateY(${y}px)`};
function typeInto(el,text,p){el.textContent=text.slice(0,Math.floor(text.length*clamp(p)))}
function rnd(seed){return()=>(seed=seed*16807%2147483647)/2147483647}


const NPRT=10, DEF=4, ENT=i=>3.6+i*1.5, VX=430, ZX=896;
$('#pgroup').innerHTML=Array.from({length:NPRT},(_,i)=>`
  <g id="pg${i}" opacity="0">
    <rect x="-70" y="-60" width="140" height="120" rx="10" fill="#fff"
          stroke="var(--rule)" stroke-width="3"/>
    <rect x="-26" y="-78" width="52" height="20" rx="5" fill="var(--ink)"/>
    ${i===DEF?'<circle cx="34" cy="18" r="7" fill="var(--signal)"/>':''}
  </g>`).join('');
const pgEls=Array.from({length:NPRT},(_,i)=>document.getElementById('pg'+i));


const chEls=[...document.querySelectorAll('.ch')];
const statEls=[...document.querySelectorAll('.stat')];
const barEls=chEls.map(c=>[...c.querySelectorAll('.bars i')]);


function frameMid(T){
  $('#s1').style.opacity=seg(T,0,0.5)*(1-seg(T,2.4,3.0));
  $('#s1big').textContent=T<1.4?'camera 01 — calibrating':'camera 01 — ready';
  $('#mid').style.opacity=seg(T,2.8,3.4)*(1-seg(T,18.4,19.0));

  let occupant=-1;
  for(let i=0;i<NPRT;i++){
    const x=ZX+(T-ENT(i))*VX;
    let y=520, op=(x>-160&&x<1950&&T>2.8)?1:0, rot=0;
    if(i===DEF&&x>1180){          // the reject: diverted off the line
      const d=x-1180;
      y+=d*1.1; rot=d*0.12;
      op*= (1-seg(d,220,340));
    }
    pgEls[i].setAttribute('transform',`translate(${x} ${y}) rotate(${rot})`);
    pgEls[i].setAttribute('opacity',op);
    if(Math.abs(x-ZX)<130&&(i!==DEF||x<1180)) occupant=i;
  }

  const box=$('#hibox'), tag=$('#ptag');
  if(occupant>=0){
    const x=ZX+(T-ENT(occupant))*VX, bad=occupant===DEF;
    box.setAttribute('x',x-85); box.setAttribute('opacity',1);
    box.setAttribute('stroke', bad?'var(--signal)':'var(--ok)');
    tag.setAttribute('transform',`translate(${x} 440)`);
    tag.setAttribute('opacity',1);
    const tx=$('#ptagTx'), bg=$('#ptagBg');
    tx.textContent=bad?'defect — chip 0.3 mm':'pass ✓';
    tx.setAttribute('fill', bad?'var(--signal)':'var(--ok)');
    bg.setAttribute('stroke', bad?'var(--signal)':'var(--rule)');
    bg.setAttribute('width', bad?390:170);
    bg.setAttribute('x', bad?-195:-85);
  }else{box.setAttribute('opacity',0);tag.setAttribute('opacity',0)}

  const done=clamp(Math.floor((T-ENT(0)-0.35)/1.5)+1,0,NPRT);
  $('#cIn').textContent=done;
  $('#cDef').textContent=T>ENT(DEF)+0.35?1:0;
  $('#headName').textContent=`inspected — ${String(done).padStart(4,'0')}`;

  $('#caption').style.opacity=seg(T,15.6,16.2)*(1-seg(T,18.2,18.7));
}


function frame(t){
  const T=t/1000;
  const ms=Math.floor(t)%1000, ss=Math.floor(t/1000)%60, mm=Math.floor(t/60000);
  $('#tc').textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
  $('#head').style.opacity=seg(T,1.2,2.0);
  frameMid(T);
  const inCh=seg(T,19.3,19.9)*(1-seg(T,23.9,24.5));
  $('#s4').style.opacity=inCh;
  chEls.forEach((el,i)=>{
    const p=seg(T,19.5+i*0.26,20.3+i*0.26);
    set(el,p,(1-out(p))*26);
    barEls[i].forEach((b,j)=>{
      b.style.height=`${6+Math.abs(Math.sin(T*2.6+j*0.5+i*1.3))*28*p}px`;
      b.style.background=j<16?'var(--rule)':CONFIG.barHi;
    });
  });
  $('#s5').style.opacity=seg(T,24.3,24.9);
  statEls.forEach((el,i)=>{const p=seg(T,24.6+i*0.22,25.4+i*0.22);set(el,p,(1-out(p))*20)});
  set($('#lock'),seg(T,26.4,27.2),(1-out(seg(T,26.4,27.4)))*24);
}

let muted=false, AC=null;
function ctx(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(at,dur,freqs,vol,type='sine'){
  if(muted)return;
  const c=ctx(),g=c.createGain(),t0=c.currentTime+at;
  g.connect(c.destination);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0005,t0+dur);
  freqs.forEach(f=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;
    o.connect(g);o.start(t0);o.stop(t0+dur)});
}
let cues=[];

function armProductCues(){
  for(let i=0;i<10;i++){
    const e=3600+i*1500;
    cues.push({t:e,fn:()=>tone(0,0.03,[1900],0.014,'square')});     // shutter
    if(i!==4) cues.push({t:e+320,fn:()=>tone(0,0.09,[880],0.022)}); // pass blip
  }
  cues.push(
    {t:9700, fn:()=>tone(0,0.32,[210,158],0.05)},                   // defect
    {t:10650,fn:()=>tone(0,0.16,[110],0.06)}                        // reject thunk
  );
}

function armCues(){cues=[];armProductCues();cues.push({t:29000,fn:()=>tone(0,0.5,[523,784],0.035)});cues.sort((a,b)=>a.t-b.t)}
function setMute(m){muted=m;syncMute()}
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')setMute(!muted)});

let elapsed=0,played=0,paused=false,running=false;
let start=null,raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){
  if(paused) return;
  if(start===null)start=ts;
  const t=elapsed+(ts-start);
  played=t;
  while(cues.length&&t>=cues[0].t)cues.shift().fn();
  frame(Math.min(t,DUR));
  if(!paused&&t<DUR+1200) raf=requestAnimationFrame(loop);
  else if(t>=DUR+1200){ running=false; paused=false; syncPause(); }
}
function play(){
  cancelAnimationFrame(raf);
  elapsed=0;played=0;paused=false;running=true;start=null;
  if(typeof AC!=='undefined'&&AC&&AC.state==='suspended') AC.resume();
  armCues();
  syncPause();
  raf=requestAnimationFrame(loop);
}
$('#replay').addEventListener('click',play);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play()});

function syncPause(){
  const p=$('#pause'); if(!p) return;
  p.disabled=!running;
  p.textContent=paused?'Resume':'Pause';
  p.setAttribute('aria-pressed', paused?'true':'false');
  p.setAttribute('aria-label', paused?'Resume demo':'Pause demo');
  document.body.classList.toggle('is-paused', paused);
}
function syncMute(){
  const b=$('#mute'); if(!b) return;
  b.textContent=muted?'Unmute':'Mute';
  b.setAttribute('aria-pressed', muted?'true':'false');
  b.setAttribute('aria-label', muted?'Unmute demo':'Mute demo');
}
function holdAudio(){
  try{ if(typeof AC!=='undefined'&&AC&&AC.state==='running') AC.suspend(); }catch(e){}
  try{ if(window.speechSynthesis&&speechSynthesis.speaking) speechSynthesis.pause(); }catch(e){}
  try{ if(typeof audioEl!=='undefined'&&audioEl&&!audioEl.paused) audioEl.pause(); }catch(e){}
}
function releaseAudio(){
  try{ if(typeof AC!=='undefined'&&AC&&AC.state==='suspended') AC.resume(); }catch(e){}
  try{ if(window.speechSynthesis&&speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  try{
    if(typeof audioEl!=='undefined'&&audioEl&&audioEl.paused&&!muted&&audioEl.currentTime>0&&!audioEl.ended)
      audioEl.play().catch(function(){});
  }catch(e){}
}
function togglePause(){
  if(!running) return;
  if(paused){
    paused=false; start=null; releaseAudio();
    raf=requestAnimationFrame(loop);
  }else{
    cancelAnimationFrame(raf);
    elapsed=played; start=null; paused=true;
    holdAudio();
  }
  syncPause();
}
function wireTransport(){
  $('#pause').addEventListener('click', function(e){ e.stopPropagation(); togglePause(); });
  $('#mute').addEventListener('click', function(e){ e.stopPropagation(); setMute(!muted); });
  addEventListener('keydown', function(e){
    if(e.key===' '||e.key==='p'||e.key==='P'){
      if(e.target&&e.target.closest&&e.target.closest('button')) return;
      e.preventDefault(); togglePause();
    }
  });
  const stage=$('#stage');
  if(stage){
    let ptr=null;
    stage.addEventListener('pointerdown', function(e){
      if(e.target.closest&&e.target.closest('button,a')) return;
      ptr={x:e.clientX,y:e.clientY,id:e.pointerId};
    });
    stage.addEventListener('pointerup', function(e){
      if(!ptr||e.pointerId!==ptr.id) return;
      const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y; ptr=null;
      if(dx*dx+dy*dy>64) return;
      if(e.target.closest&&e.target.closest('button,a')) return;
      togglePause();
    });
    stage.addEventListener('pointercancel', function(){ ptr=null; });
  }
  syncPause(); syncMute();
}

wireTransport();
