<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industrial Automation — 30s teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#CFE2EF; --panel:#E6F0F8; --card:#F7FBFE; --rule:#A7C3D7;
  --ink:#10222F; --dim:#456579; --body:#3A5E76;
  --amber:#8A5102; --ok:#1E6B45; --caller:#1C6B67; --signal:#C6371F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#7FA3BC;overflow:hidden}
body{font-family:Archivo,system-ui,sans-serif}
#fit{width:100vw;height:100vh;position:relative;overflow:hidden}
#stage{width:1920px;height:1080px;overflow:hidden;background:var(--sky);color:var(--ink);
       position:absolute;left:50%;top:50%}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(120% 80% at 50% 42%,transparent 42%,rgba(28,74,105,.20) 100%),
  repeating-linear-gradient(0deg,rgba(16,34,47,.022) 0 1px,transparent 1px 3px)}
.mono{font-family:"DM Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.disp{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 78,"wght" 800;
      text-transform:uppercase;letter-spacing:-.005em;line-height:.94}
#head{position:absolute;top:0;left:0;right:0;height:96px;z-index:30;display:flex;align-items:center;
  gap:28px;padding:0 64px;border-bottom:1px solid var(--rule);background:var(--panel);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;opacity:0}
#dot{width:13px;height:13px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 12px var(--ok)}
#dotLabel{font-size:14px;color:var(--dim)}
#headName{margin-left:auto;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
#tc{font-size:15px;color:var(--dim);min-width:132px;text-align:right;font-variant-numeric:tabular-nums}
.scene{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none}
#caption{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:36;opacity:0;
  white-space:nowrap;font-size:32px;color:var(--ink);font-variation-settings:"wdth" 90,"wght" 600;
  background:var(--panel);border:1px solid var(--rule);border-radius:40px;padding:18px 44px;
  box-shadow:0 6px 22px rgba(16,52,78,.16)}
#s4{display:grid;place-items:center;padding:0 64px}
#chans{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:1792px}
.ch{background:var(--panel);padding:52px 44px 44px;opacity:0;transform:translateY(26px);
    box-shadow:0 2px 12px rgba(16,52,78,.10)}
.ch .n{font-size:13px;color:var(--dim)}
.ch .t{margin-top:22px;font-size:60px;font-variation-settings:"wdth" 74,"wght" 900;
       text-transform:uppercase;line-height:.94}
.ch .d{margin-top:20px;font-size:24px;color:var(--body);line-height:1.42;
       font-variation-settings:"wdth" 100,"wght" 400}
.ch .bars{display:flex;gap:5px;margin-top:38px;height:34px;align-items:flex-end}
.ch .bars i{flex:1;background:var(--rule);display:block}
#s5{display:grid;place-items:center;padding:0 96px}
#s5in{width:100%;max-width:1728px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);
       border-bottom:1px solid var(--rule)}
.stat{padding:44px 0;opacity:0}
.stat .v{font-size:96px;font-variation-settings:"wdth" 68,"wght" 900;color:var(--ink);
         font-family:"DM Mono",monospace;letter-spacing:-.03em;line-height:1}
.stat .v em{font-style:normal;font-size:38px;color:var(--dim);margin-left:8px}
.stat .k{margin-top:18px;font-size:14px;color:var(--dim)}
#lock{margin-top:76px;display:flex;align-items:flex-end;justify-content:space-between;opacity:0}
#brand{font-size:104px;font-variation-settings:"wdth" 66,"wght" 900;line-height:.9}
#tag{margin-top:26px;font-size:29px;color:var(--body);font-variation-settings:"wdth" 100,"wght" 400}
#cta{text-align:right;font-size:15px;color:var(--dim);line-height:2.1}
#cta b{display:block;font-family:Archivo;font-size:31px;color:var(--amber);letter-spacing:0;
       text-transform:none;font-variation-settings:"wdth" 100,"wght" 600;margin-top:10px}
#cover{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--sky);
       transition:opacity .45s}
#cover.gone{opacity:0;pointer-events:none}
#coverBtn{display:grid;place-items:center;gap:26px;background:none;border:none;cursor:pointer;
          color:var(--ink);font-family:Archivo,sans-serif}
#coverBtn:focus-visible{outline:2px solid var(--amber);outline-offset:8px}
#coverRing{width:112px;height:112px;border-radius:50%;border:2px solid var(--ink);
           display:grid;place-items:center}
#coverRing svg{width:34px;height:34px;fill:var(--ink);margin-left:5px}
#coverTxt{font-size:16px;letter-spacing:.14em}
#coverSub{font-size:12px;color:var(--dim);letter-spacing:.12em}
#ctl{position:fixed;left:20px;bottom:20px;z-index:99;display:flex;gap:10px;align-items:center;
     opacity:0;transition:opacity .25s}
body.show #ctl{opacity:1}
#ctl button{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background:#E6F0F8;color:#3A5E76;border:1px solid #A7C3D7;padding:11px 18px;border-radius:2px;cursor:pointer}
#ctl button:hover{color:var(--amber);border-color:var(--amber)}
#ctl button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#ctl span{font-family:"DM Mono",monospace;font-size:11px;color:#D8E7F1;letter-spacing:.1em}

#s1{display:grid;place-items:center}
#s1in{text-align:center}
#s1big{font-size:17px;color:var(--dim)}
#mid{position:absolute;left:64px;top:150px;width:1792px;z-index:22;opacity:0}
#line{width:1792px;height:660px;display:block}
#status{position:absolute;left:6px;top:600px;font-size:15px}
#status .lbl{color:var(--dim)}

</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="head">
    <span id="dot"></span><span id="dotLabel" class="mono"></span>
    <span id="headName" class="mono"></span><span id="tc" class="mono">00:00.000</span>
  </div>

  <section class="scene" id="s1"><div id="s1in">
    <div id="s1big" class="mono">line 4 — power on</div>
  </div></section>
  <div id="mid">
    <svg id="line" viewBox="0 0 1792 660">
      <line x1="40" y1="560" x2="1752" y2="560" stroke="var(--rule)" stroke-width="4"/>
      <line x1="40" y1="586" x2="1752" y2="586" stroke="var(--rule)" stroke-width="2"/>
      <g id="stations"></g>
      <path id="bypass" d="M 880 548 C 940 300, 1210 300, 1270 548"
            fill="none" stroke="var(--amber)" stroke-width="5" stroke-dasharray="14 12" opacity="0"/>
      <g id="parts"></g>
    </svg>
    <div id="status" class="mono"><span class="lbl">status — </span><span id="statTx"></span></div>
  </div>

  <div id="caption"></div>
  <section class="scene" id="s4"><div id="chans"></div></section>
  <section class="scene" id="s5"><div id="s5in">
    <div id="stats"></div>
    <div id="lock">
      <div><h1 id="brand" class="disp"></h1><p id="tag"></p></div>
      <div id="cta" class="mono"><span></span><b></b></div>
    </div>
  </div></section>
  <div id="cover">
    <button id="coverBtn" type="button" aria-label="Play teaser with sound">
      <span id="coverRing"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg></span>
      <span id="coverTxt" class="mono">play with sound</span>
      <span id="coverSub" class="mono">30 seconds &middot; sound on</span>
    </button>
  </div>
</div></div>
<div id="ctl">
  <button id="replay" type="button">Replay</button>
  <span id="hint">R replay &middot; M mute &middot; controls hide while idle</span>
</div>
<script>
const CONFIG = {
  brand:"Industrial Automation", tagline:"Downtime, automated away.",
  ctaLine:"Book a line audit", ctaUrl:"yoursite.com/automation",
  caption:"The line doesn't stop.",
  headLeft:"line 4 — running", headRight:"units — 0000",
  barHi:"var(--ok)",
  channels:[
    { n:"cell 01", t:"Assembly",    d:"Robots and PLCs on one orchestrated line." },
    { n:"cell 02", t:"Packaging",   d:"Changeovers in minutes, not shifts." },
    { n:"cell 03", t:"Palletizing", d:"End-of-line, lights-out ready." }
  ],
  stats:[
    { v:"99.7", u:"%", k:"line uptime" },
    { v:"2.1",  u:"s", k:"fault recovery" },
    { v:"+38",  u:"%", k:"throughput gained" }
  ]
};
const DUR = 30000;
const $ = s => document.querySelector(s);
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

$('#brand').textContent = CONFIG.brand;
$('#tag').textContent = CONFIG.tagline;
$('#cta span').textContent = CONFIG.ctaLine;
$('#cta b').textContent = CONFIG.ctaUrl;
$('#caption').textContent = CONFIG.caption;
$('#dotLabel').textContent = CONFIG.headLeft;
$('#headName').textContent = CONFIG.headRight;
$('#chans').innerHTML = CONFIG.channels.map(c => `
  <div class="ch"><div class="n mono">${c.n}</div><div class="t">${c.t}</div>
  <div class="d">${c.d}</div><div class="bars">${'<i></i>'.repeat(22)}</div></div>`).join('');
$('#stats').innerHTML = CONFIG.stats.map(s => `
  <div class="stat"><div class="v">${s.v}${s.u?`<em>${s.u}</em>`:''}</div>
  <div class="k mono">${s.k}</div></div>`).join('');

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const lerp=(a,b,p)=>a+(b-a)*p;
const set=(el,o,y=0)=>{el.style.opacity=o;if(y!==null)el.style.transform=`translateY(${y}px)`};
function typeInto(el,text,p){el.textContent=text.slice(0,Math.floor(text.length*clamp(p)))}
function rnd(seed){return()=>(seed=seed*16807%2147483647)/2147483647}


const ST=[{n:'FEED',x:180},{n:'WELD',x:600},{n:'QC',x:1020},{n:'PACK',x:1440}];
$('#stations').innerHTML=ST.map((s,i)=>`
  <g id="st${i}"><rect x="${s.x-105}" y="392" width="210" height="118" rx="8"
     fill="var(--panel)" stroke="var(--rule)" stroke-width="2.5"/>
  <text x="${s.x}" y="462" text-anchor="middle" fill="var(--dim)"
     font-family="DM Mono, monospace" font-size="20" letter-spacing="3">${s.n}</text>
  <line x1="${s.x}" y1="510" x2="${s.x}" y2="548" stroke="var(--rule)" stroke-width="4"/></g>`).join('');
const NP=12;
$('#parts').innerHTML=Array.from({length:NP},(_,i)=>
  `<rect id="pt${i}" x="0" y="514" width="46" height="40" rx="6"
    fill="var(--ink)" opacity="0"/>`).join('');
const ptEls=Array.from({length:NP},(_,i)=>document.getElementById('pt'+i));
const stQC=document.getElementById('st2').querySelector('rect');


const chEls=[...document.querySelectorAll('.ch')];
const statEls=[...document.querySelectorAll('.stat')];
const barEls=chEls.map(c=>[...c.querySelectorAll('.bars i')]);


function frameMid(T){
  $('#s1').style.opacity=seg(T,0,0.5)*(1-seg(T,2.2,2.8));
  $('#mid').style.opacity=seg(T,2.6,3.2)*(1-seg(T,18.4,19.0));

  const jam=T>=8.8&&T<9.6, rer=T>=9.6&&T<13.2;
  stQC.setAttribute('stroke', jam?'var(--signal)':rer?'var(--amber)':'var(--rule)');
  stQC.setAttribute('stroke-width', (jam||rer)?'5':'2.5');
  $('#bypass').setAttribute('opacity', seg(T,9.5,9.9)*(1-seg(T,13.2,13.7)));

  const SPEED=0.14;
  for(let i=0;i<NP;i++){
    const pos=((T-3)*SPEED+i/NP)%1;
    const x=-60+pos*1880;
    let y=514;
    if(rer&&pos>0.52&&pos<0.66) y-=Math.sin(Math.PI*(pos-0.52)/0.14)*198;
    const el=ptEls[i];
    el.setAttribute('x',x); el.setAttribute('y',y);
    el.setAttribute('opacity', T>3&&x>-50&&x<1800?1:0);
  }

  const units=Math.max(0,Math.floor((T-3)*2.6));
  $('#headName').textContent=`units — ${String(units).padStart(4,'0')}`;

  const st=$('#statTx');
  if(T<8.8){st.textContent='running';st.style.color='var(--ok)'}
  else if(T<9.6){st.textContent='fault — station qc';st.style.color='var(--signal)'}
  else if(T<13.2){st.textContent='rerouted — line moving';st.style.color='var(--amber)'}
  else{st.textContent='recovered in 2.1 s — running';st.style.color='var(--ok)'}

  $('#caption').style.opacity=seg(T,15.4,16.0)*(1-seg(T,18.2,18.7));
}


function frame(t){
  const T=t/1000;
  const ms=Math.floor(t)%1000, ss=Math.floor(t/1000)%60, mm=Math.floor(t/60000);
  $('#tc').textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(3,'0')}`;
  $('#head').style.opacity=seg(T,1.2,2.0);
  frameMid(T);
  const inCh=seg(T,19.3,19.9)*(1-seg(T,23.9,24.5));
  $('#s4').style.opacity=inCh;
  chEls.forEach((el,i)=>{
    const p=seg(T,19.5+i*0.26,20.3+i*0.26);
    set(el,p,(1-out(p))*26);
    barEls[i].forEach((b,j)=>{
      b.style.height=`${6+Math.abs(Math.sin(T*2.6+j*0.5+i*1.3))*28*p}px`;
      b.style.background=j<16?'var(--rule)':CONFIG.barHi;
    });
  });
  $('#s5').style.opacity=seg(T,24.3,24.9);
  statEls.forEach((el,i)=>{const p=seg(T,24.6+i*0.22,25.4+i*0.22);set(el,p,(1-out(p))*20)});
  set($('#lock'),seg(T,26.4,27.2),(1-out(seg(T,26.4,27.4)))*24);
}

let muted=false, AC=null;
function ctx(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(at,dur,freqs,vol,type='sine'){
  if(muted)return;
  const c=ctx(),g=c.createGain(),t0=c.currentTime+at;
  g.connect(c.destination);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0005,t0+dur);
  freqs.forEach(f=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;
    o.connect(g);o.start(t0);o.stop(t0+dur)});
}
let cues=[];

function armProductCues(){
  for(let t=3200;t<18200;t+=700)
    cues.push({t,fn:()=>tone(0,0.03,[1500],0.008,'square')});   // line rhythm
  cues.push(
    {t:8800, fn:()=>tone(0,0.35,[196,247],0.05)},               // fault
    {t:9600, fn:()=>tone(0,0.4,[392,494,587],0.035)},           // reroute engaged
    {t:13200,fn:()=>tone(0,0.35,[523,659],0.04)}                // recovered
  );
}

function armCues(){cues=[];armProductCues();cues.push({t:29000,fn:()=>tone(0,0.5,[523,784],0.035)});cues.sort((a,b)=>a.t-b.t)}
function setMute(m){muted=m;
  $('#hint').textContent=`R replay \u00B7 M ${m?'unmute':'mute'} \u00B7 controls hide while idle`}
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')setMute(!muted)});

let start=null,raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){
  if(start===null)start=ts;
  const t=ts-start;
  while(cues.length&&t>=cues[0].t)cues.shift().fn();
  frame(Math.min(t,DUR));
  if(t<DUR+1200)raf=requestAnimationFrame(loop);
}
function play(){cancelAnimationFrame(raf);armCues();start=null;raf=requestAnimationFrame(loop)}
$('#replay').addEventListener('click',play);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play()});
let idle;
function wake(){document.body.classList.add('show');clearTimeout(idle);
  idle=setTimeout(()=>document.body.classList.remove('show'),2200)}
addEventListener('mousemove',wake);wake();
const cover=$('#cover');
if(reduce){cover.classList.add('gone');frame(DUR)}
else{
  frame(0);
  $('#coverBtn').addEventListener('click',()=>{ctx();cover.classList.add('gone');
    setTimeout(play,380)},{once:true});
}
</script>
</body>
</html>
